<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeEase - Business Infographic</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/tabler-icons.min.css">
<style>
  :root {
    --accent: #2a78d6;
    --accent-bg: #e6f1fb;
    --accent-text: #0c447c;
    --surface-0: #f5f5f4;
    --surface-1: #fafaf9;
    --surface-2: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.18);
    --warning-bg: #faeeda;
    --warning-text: #854f0b;
    --purple: #534AB7;
    --teal: #0F6E56;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #3987e5;
      --accent-bg: #0c2d4f;
      --accent-text: #85b7eb;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --surface-2: #222221;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --warning-bg: #412402;
      --warning-text: #fac775;
      --purple: #afa9ec;
      --teal: #5dcaa5;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    line-height: 1.5;
    padding: 1.5rem;
    display: flex;
    justify-content: center;
  }
  .info-wrap { max-width: 720px; width: 100%; }
  .lang-toggle { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .lang-btn { display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 20px; overflow: hidden; cursor: pointer; user-select: none; }
  .lang-opt { padding: 6px 16px; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; cursor: pointer; border: none; background: none; }
  .lang-opt.active { background: var(--accent); color: #fff; }
  .hero { text-align: center; margin-bottom: 1.5rem; padding: 1.5rem 1rem; background: var(--accent-bg); border-radius: 12px; }
  .hero h1 { font-size: 24px; font-weight: 600; color: var(--accent-text); margin-bottom: 4px; }
  .hero .subtitle { font-size: 15px; font-weight: 500; color: var(--accent-text); margin-bottom: 6px; }
  .hero .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; max-width: 560px; margin: 0 auto; }
  .section { margin-bottom: 1.5rem; }
  .section-title { font-size: 15px; font-weight: 500; color: var(--text-primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .section-title i { font-size: 18px; color: var(--accent); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 540px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .card-icon { font-size: 20px; margin-bottom: 4px; }
  .card h3 { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
  .card p { font-size: 11.5px; color: var(--text-secondary); line-height: 1.4; }
  .feat-card .card-icon { color: var(--purple); }
  .data-card .card-icon { color: var(--teal); }
  .flow-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .step-box { background: var(--accent-bg); color: var(--accent-text); font-size: 12px; font-weight: 500; padding: 7px 11px; border-radius: var(--radius); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .step-box .num { background: var(--accent); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .flow-arrow { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }
  .uc-list { display: flex; flex-direction: column; gap: 8px; }
  .uc-card { background: var(--surface-1); border-radius: var(--radius); padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .uc-num { background: var(--accent-bg); color: var(--accent-text); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 1px; }
  .uc-card h4 { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .uc-card p { font-size: 11.5px; color: var(--text-secondary); line-height: 1.4; margin-top: 2px; }
  .sync-row { display: flex; gap: 10px; }
  @media (max-width: 540px) { .sync-row { flex-direction: column; } }
  .sync-box { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; text-align: center; }
  .sync-box i { font-size: 22px; color: var(--accent); display: block; margin-bottom: 4px; }
  .sync-box h4 { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
  .sync-box p { font-size: 11.5px; color: var(--text-secondary); line-height: 1.4; }
  .tech-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .tech-pill { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
  .tech-pill i { font-size: 15px; color: var(--text-muted); }
  .limit-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .limit-pill { background: var(--warning-bg); color: var(--warning-text); font-size: 12px; padding: 5px 12px; border-radius: 20px; }
  .footer { text-align: center; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .footer p { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="info-wrap" id="infographic">

  <div class="lang-toggle">
    <div class="lang-btn">
      <button class="lang-opt active" data-lang="en" onclick="setLang('en')">English</button>

  </div>

      <div class="card feat-card"><div class="card-icon"><i class="ti ti-receipt" aria-hidden="true"></i></div><h3 data-key="f4_t"></h3><p data-key="f4_d"></p></div>
      <div class="card feat-card"><div class="card-icon"><i class="ti ti-file-invoice" aria-hidden="true"></i></div><h3 data-key="f5_t"></h3><p data-key="f5_d"></p></div>
      <div class="card feat-card"><div class="card-icon"><i class="ti ti-report-analytics" aria-hidden="true"></i></div><h3 data-key="f6_t"></h3><p data-key="f6_d"></p></div>
      <div class="card feat-card"><div class="card-icon"><i class="ti ti-calculator" aria-hidden="true"></i></div><h3 data-key="f7_t"></h3><p data-key="f7_d"></p></div>

    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-database" aria-hidden="true"></i> <span data-key="sec_tables"></span></div>
    <div class="grid-3">
      <div class="card data-card"><div class="card-icon"><i class="ti ti-category" aria-hidden="true"></i></div><h3 data-key="t1_t"></h3><p data-key="t1_d"></p></div>
      <div class="card data-card"><div class="card-icon"><i class="ti ti-box" aria-hidden="true"></i></div><h3 data-key="t2_t"></h3><p data-key="t2_d"></p></div>

      <div class="card data-card"><div class="card-icon"><i class="ti ti-history" aria-hidden="true"></i></div><h3 data-key="t6_t"></h3><p data-key="t6_d"></p></div>

    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-arrows-right-left" aria-hidden="true"></i> <span data-key="sec_flow"></span></div>
    <div class="flow-steps">
      <div class="step-box"><span class="num">1</span> <span data-key="s1"></span></div>
      <span class="flow-arrow"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      <div class="step-box"><span class="num">2</span> <span data-key="s2"></span></div>
      <span class="flow-arrow"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      <div class="step-box"><span class="num">3</span> <span data-key="s3"></span></div>
      <span class="flow-arrow"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      <div class="step-box"><span class="num">4</span> <span data-key="s4"></span></div>
      <span class="flow-arrow"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      <div class="step-box"><span class="num">5</span> <span data-key="s5"></span></div>
      <span class="flow-arrow"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      <div class="step-box"><span class="num">6</span> <span data-key="s6"></span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-bulb" aria-hidden="true"></i> <span data-key="sec_uc"></span></div>

      <div class="uc-card"><div class="uc-num">2</div><div><h4 data-key="u2_t"></h4><p data-key="u2_d"></p></div></div>
      <div class="uc-card"><div class="uc-num">3</div><div><h4 data-key="u3_t"></h4><p data-key="u3_d"></p></div></div>
      <div class="uc-card"><div class="uc-num">4</div><div><h4 data-key="u4_t"></h4><p data-key="u4_d"></p></div></div>
      <div class="uc-card"><div class="uc-num">5</div><div><h4 data-key="u5_t"></h4><p data-key="u5_d"></p></div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-cloud" aria-hidden="true"></i> <span data-key="sec_sync"></span></div>
    <div class="sync-row">
      <div class="sync-box"><i class="ti ti-plug-connected" aria-hidden="true"></i><h4 data-key="sy1_t"></h4><p data-key="sy1_d"></p></div>
      <div class="sync-box"><i class="ti ti-upload" aria-hidden="true"></i><h4 data-key="sy2_t"></h4><p data-key="sy2_d"></p></div>
      <div class="sync-box"><i class="ti ti-download" aria-hidden="true"></i><h4 data-key="sy3_t"></h4><p data-key="sy3_d"></p></div>
    </div>
  </div>

  <div class="section">

      <span class="tech-pill"><i class="ti ti-database" aria-hidden="true"></i> IndexedDB</span>

      <span class="tech-pill"><i class="ti ti-api" aria-hidden="true"></i> Apps Script API</span>
      <span class="tech-pill"><i class="ti ti-brand-github" aria-hidden="true"></i> GitHub Pages</span>
      <span class="tech-pill"><i class="ti ti-file-type-pdf" aria-hidden="true"></i> jsPDF</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title"><i class="ti ti-alert-triangle" aria-hidden="true"></i> <span data-key="sec_limit"></span></div>
    <div class="limit-list" id="limitList"></div>
  </div>

  <div class="footer">
    <p>TradeEase v1.0 &middot; Auto Comply Solutions &middot; tradeease-billing.autocomplys.com</p>
  </div>

</div>

var currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-opt').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-lang') === lang);
  });
  var strings = T[lang];
  document.querySelectorAll('[data-key]').forEach(function(el) {
    var key = el.getAttribute('data-key');
    if (strings[key] !== undefined) el.textContent = strings[key];
  });
  var list = document.getElementById('limitList');
  list.innerHTML = '';
  strings.limits.forEach(function(txt) {
    var s = document.createElement('span');
    s.className = 'limit-pill';
    s.textContent = txt;
    list.appendChild(s);
  });
}

setLang('en');
